# L'Entre-Deux, light: the dark theme flipped. Pale yellow page, dark blue
# text; the poster's darker blues and teals stand in for its lighter teals and
# mint, and the grey and the coral are darkened. Flame, green, violet and
# magenta are the poster's colors, darkened where needed.

"ui.background" = { bg = "cream" }
"ui.text" = "ink"

# Surfaces
"ui.statusline" = { fg = "blue-mid", bg = "cream-panel" }
"ui.cursorline.primary" = { bg = "cream-line" }
"ui.selection" = { bg = "mint-soft" }
"ui.selection.primary" = { bg = "mint-soft" }
"ui.linenr" = { fg = "grey-light" }
"ui.linenr.selected" = { fg = "flame" }

# Mode colors: fills.
"ui.statusline.normal" = { bg = "teal-deep" }
"ui.statusline.insert" = { bg = "flame" }
"ui.statusline.select" = { bg = "violet" }

# Prose
"markup.heading.1" = "flame"
"markup.heading.2" = "blue-mid"
"markup.heading.3" = "teal-deep"
"markup.heading.4" = "teal"
"markup.bold" = "coral"
"markup.italic" = "violet"
"markup.raw.inline" = "green"
"markup.link.text" = "teal-deep"
"markup.link.url" = "teal-deep"
"markup.list" = "coral"
"markup.quote" = "violet"
"diff.plus" = "green"
"diff.minus" = "magenta"
"info" = "coral"
"error" = "magenta"

# Code
"comment" = "slate"
"keyword" = "violet"
"function" = "teal-deep"
"string" = "green"
"type" = "coral"
"constant" = "flame"
"constant.numeric" = "coral"
"operator" = "teal-deep"
"variable.other.member" = "coral"

[palette]
cream = "#f2f1c2"
ink = "#4d6c80"
blue-mid = "#37698c"
teal-deep = "#478387"
teal = "#54999e"
mint = "#c3dad7"
slate = "#819099"
coral = "#bd7271"
flame = "#b86b3b"
magenta = "#a54460"
green = "#3f744d"
violet = "#7e5983"
mint-soft = "#dce2d8"
cream-panel = "#e7e5b4"
cream-line = "#edecbd"
grey-light = "#b2b2a1"
