  <rect width="1024" height="1024" rx="225" fill="url(#tile)"/>
  <rect x="3" y="3" width="1018" height="1018" rx="222" fill="none" stroke="#545464" stroke-opacity="0.14" stroke-width="6"/>
  <g filter="url(#lift)">
    <rect x="190" y="250" width="620" height="524" fill="url(#band)"/>
    <rect x="730" y="250" width="80" height="524" fill="url(#cursor)"/>
  </g>
  <polygon points="260,724 260,300 340,300 480,470 620,300 700,300 700,724 620,724 620,420 480,590 340,420 340,724" fill="url(#ink)"/>
