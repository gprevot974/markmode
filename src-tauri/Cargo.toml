[package]
name = "md-editor"
version = "0.1.0"
description = "Markdown editor with Helix keybindings and live preview"
edition = "2021"

[lib]
name = "md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
