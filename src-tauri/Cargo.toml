[package]
name = "md-editor"
version = "0.1.0"
description = "Markdown editor with Helix keybindings and live preview"
edition = "2021"

[lib]
name = "md_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-clipboard-manager = "2.5"
notify = "8.2"
ignore = "0.4"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
toml = "0.9"
percent-encoding = "2.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSRange", "NSArray", "NSData", "NSDictionary", "NSURL", "NSFileManager", "NSError"] }
objc2-app-kit = { version = "0.3", features = ["NSSpellChecker", "NSPasteboard", "NSPasteboardItem", "NSBitmapImageRep", "NSImageRep"] }
