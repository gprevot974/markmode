<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfce0"/>
      <stop offset="1" stop-color="#f2f1c2"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe2e0"/>
      <stop offset="1" stop-color="#b7d2cf"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#296084"/>
      <stop offset="1" stop-color="#164a6b"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ed7f5b"/>
      <stop offset="1" stop-color="#c26141"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#02304d" flood-opacity="0.28"/>
    </filter>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- macOS icon grid: the 1024 tile shrinks to 824 and is centered, leaving room for the shadow. -->
  <g filter="url(#tile-shadow)">
    <g transform="translate(100 100) scale(0.8046875)">
      <rect width="1024" height="1024" rx="225" fill="url(#tile)"/>
      <rect x="3" y="3" width="1018" height="1018" rx="222" fill="none" stroke="#02304d" stroke-opacity="0.14" stroke-width="6"/>
      <g filter="url(#lift)">
        <rect x="190" y="250" width="620" height="524" fill="url(#band)"/>
        <rect x="730" y="250" width="80" height="524" fill="url(#cursor)"/>
      </g>
      <polygon points="260,724 260,300 340,300 480,470 620,300 700,300 700,724 620,724 620,420 480,590 340,420 340,724" fill="url(#ink)"/>
    </g>
  </g>
</svg>
