<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markmode</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Pick light or dark, a Helix theme's colors and the zoom before the
      // first paint; src/theme/appearance.ts and src/ui/zoom.ts take over.
      try {
        const root = document.documentElement;
        const t = localStorage.getItem("markmode.theme");
        const helix = JSON.parse(localStorage.getItem("markmode.theme-vars") ?? "null");
        let light = t === "light" || t === "kanagawa-lotus" || (t !== "dark" && t !== "kanagawa-wave" && matchMedia("(prefers-color-scheme: light)").matches);
        if (helix) {
          light = helix.light;
          for (const [k, v] of Object.entries(helix.vars)) root.style.setProperty(k, v);
        }
        root.dataset.theme = light ? "light" : "dark";
        const zoom = localStorage.getItem("markmode.zoom");
        if (zoom) root.style.setProperty("--zoom", zoom);
      } catch {}
    </script>
  </head>
  <body>
    <main id="windows"></main>
    <aside id="infobox" hidden></aside>
    <div id="popup-stack">
      <div id="completion-doc" hidden></div>
      <div id="completion" hidden></div>
    </div>
    <footer id="bottom">
      <div id="prompt" hidden>
        <span id="prompt-label"></span><input id="prompt-input" spellcheck="false" autocomplete="off" />
      </div>
      <div id="messageline">
        <span id="message"></span>
        <span id="pending"></span>
      </div>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
